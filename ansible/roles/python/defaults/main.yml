---

python_packages_force_reinstall: false

# Keyed by Ubuntu release codename
python_version_map:
  noble: "3.12"
  resolute: "3.14"

python_version: "{{ python_version_map[ansible_facts['distribution_release']] }}"

python_packages_map:
  noble:
    - python3-apt=2.7.7ubuntu5.3
    - python3-debian=0.1.49ubuntu2
    - python3-pip-whl=24.0+dfsg-1ubuntu1.3
    - python3-pip=24.0+dfsg-1ubuntu1.3
    - python3.12-dbg=3.12.3-1ubuntu0.17
    - python3.12-dev=3.12.3-1ubuntu0.17
    - python3.12-venv=3.12.3-1ubuntu0.17
    - python3.12=3.12.3-1ubuntu0.17
  resolute:
    - python3-apt=3.1.0ubuntu1.1
    - python3-debian=1.0.1ubuntu2
    - python3-pip-whl=25.1.1+dfsg-1ubuntu2
    - python3-pip=25.1.1+dfsg-1ubuntu2
    - python3.14-dbg=3.14.4-1ubuntu0.2
    - python3.14-dev=3.14.4-1ubuntu0.2
    - python3.14-venv=3.14.4-1ubuntu0.2
