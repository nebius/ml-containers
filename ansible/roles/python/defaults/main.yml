---

python_packages_force_reinstall: false

# Keyed by Ubuntu release codename
python_version_map:
  noble: "3.15"
  resolute: "3.15"

python_version: "{{ python_version_map[ansible_facts['distribution_release']] }}"

python_packages_map:
  noble:
    - python3-apt=2.7.7ubuntu5.3
    - python3-debian=0.1.49ubuntu2
    - python3-pip-whl=24.0+dfsg-1ubuntu1.3
    - python3-pip=24.0+dfsg-1ubuntu1.3
    - python3.15-dbg=3.15.2-1+noble1
    - python3.15-dev=3.15.2-1+noble1
    - python3.15-venv=3.15.2-1+noble1
    - python3.15=3.15.2-1+noble1
  resolute:
    - python3-apt=3.1.0ubuntu1.1
    - python3-debian=1.0.1ubuntu2
    - python3-pip-whl=25.1.1+dfsg-1ubuntu2
    - python3-pip=25.1.1+dfsg-1ubuntu2
    - python3.15-dbg=3.15.2-1+resolute1
    - python3.15-dev=3.15.2-1+resolute1
    - python3.15-venv=3.15.2-1+resolute1
    - python3.15=3.15.2-1+resolute1

python_packages: "{{ python_packages_map[ansible_facts['distribution_release']] }}"
