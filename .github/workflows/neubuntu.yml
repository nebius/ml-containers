name: Nebius ubuntu build (Neubuntu)

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      daytime: ${{ steps.set_daytime.outputs.daytime }}
      image_repo: ${{ steps.set_image.outputs.image_repo }}
    steps:
      - id: set_daytime
        name: Compute shared DAYTIME
        run: echo "daytime=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - id: set_image
        name: Set base image repository
        run: echo "image_repo=cr.nebius.cloud/ml-containers/neubuntu" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: ${{ matrix.release }} ${{ matrix.arch }} build
    needs: prepare
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Ubuntu 24.04 LTS: Dockerfile defaults
          - release: noble
            build_args: ""
          # Ubuntu 26.04 LTS
          - release: resolute
            build_args: >-
              --build-arg BASE_IMAGE=ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
              --build-arg UBUNTU_RELEASE=resolute
              --build-arg PYTHON_VERSION=3.14
              --build-arg PYTHON_APT_VERSION=3.14.4-1ubuntu0.2

    env:
      IMAGE: ${{ needs.prepare.outputs.image_repo }}:${{ matrix.release }}-${{ needs.prepare.outputs.daytime }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Install Nebius CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> "$GITHUB_PATH"

      - name: Restore Nebius config
        shell: bash
        run: |
          set -euo pipefail
          nebius version
          mkdir -p "$HOME/.nebius"
          echo "${{ secrets.NEBIUS_CONFIG_YAML_B64 }}" | base64 -d > "$HOME/.nebius/config.yaml"
          chmod 600 "$HOME/.nebius/config.yaml"

      - name: Configure Nebius docker credential-helper for auth
        shell: bash
        run: nebius registry configure-helper

      - name: Build and push single-arch image
        shell: bash
        run: |
          set -euo pipefail
          ARCH_TAG="${IMAGE}-${{ matrix.arch }}"
          CACHE_REF="${{ needs.prepare.outputs.image_repo }}:${{ matrix.release }}-${{ matrix.arch }}"

          echo "Pushing ${ARCH_TAG} (${{ matrix.platform }}) with cache ${CACHE_REF}"

          docker buildx build \
            --platform "${{ matrix.platform }}" \
            -t "${ARCH_TAG}" \
            --target neubuntu \
            ${{ matrix.build_args }} \
            --progress=plain \
            --cache-from=type=registry,ref="${CACHE_REF}" \
            --cache-to=type=registry,ref="${CACHE_REF}",mode=max \
            --push \
            .

  create_manifest:
    name: Create & push ${{ matrix.release }} multi-arch manifest
    needs: [prepare, build_single_arch]
    # Publish each release whose images were built, even if the other release failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute]

    env:
      IMAGE: ${{ needs.prepare.outputs.image_repo }}:${{ matrix.release }}-${{ needs.prepare.outputs.daytime }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Install Nebius CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> "$GITHUB_PATH"

      - name: Restore Nebius config
        shell: bash
        run: |
          set -euo pipefail
          nebius version
          mkdir -p "$HOME/.nebius"
          echo "${{ secrets.NEBIUS_CONFIG_YAML_B64 }}" | base64 -d > "$HOME/.nebius/config.yaml"
          chmod 600 "$HOME/.nebius/config.yaml"

      - name: Configure Nebius docker credential-helper for auth
        shell: bash
        run: nebius registry configure-helper

      - name: Create and push manifest list
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          AMD="${IMAGE}-amd64"
          ARM="${IMAGE}-arm64"

          echo "Creating multi-arch manifest: ${IMAGE}"
          echo "  - ${AMD}"
          echo "  - ${ARM}"

          docker buildx imagetools create \
            -t "${IMAGE}" \
            "${AMD}" \
            "${ARM}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT" || echo "::warning::Cannot record image for warming"

      - name: Warm published image
        continue-on-error: true
        uses: nebius/soperator/.github/actions/warm-registry@main
        with:
          images: ${{ steps.publish.outputs.image }}
